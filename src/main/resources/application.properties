spring.application.name=pixel-board

# PostgreSQL (override POSTGRES_HOST/POSTGRES_PORT in docker-compose)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/pixelboard
spring.datasource.username=pixel
spring.datasource.password=pixel123
spring.jpa.hibernate.ddl-auto=validate

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:29092
spring.kafka.consumer.group-id=pixel-board-group
spring.kafka.consumer.auto-offset-reset=earliest

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# JWT auth
app.jwt.secret=9f7b3e1c8a5d2f6b4e7a1c9d3f5b8a2e6c4d1f0a8b3e5c7d9f2a4b6c8e0d1f3a
app.jwt.expiration-ms=604800000

# One-pixel rule (seconds a user must wait between placements; 0 = disabled for now)
app.pixel.cooldown-seconds=0

# CORS (dev: Vite on 5173; prod: same origin via nginx, no CORS needed)
app.cors.allowed-origins=http://localhost:5173
